name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # renderer 归档（renderer-<version>.tar.gz）是纯 web 静态资源，构建结果平台
  # 无关。这里单点构建一次，四个平台的 build job 下载同一份字节复用——避免
  # 各平台各自现场打包出"内容相同、字节不同、sha256 不同"的四份归档（packTree
  # 在 tar 头里写入真实文件 mtime）。见 scripts/pack-renderer-box.mjs 与
  # scripts/build-server-artifact.mjs 的 packDualKindSeed prebuiltRendererArchive
  # / HANA_PREBUILT_RENDERER_BOX 入参。
  renderer-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 顺序不能颠倒：build:theme 的产物写进 dist-renderer/lib/theme.js，
      # 必须在 build:renderer 的 emptyOutDir 清空该目录之后才落地
      # （见 vite.config.theme.js 文件头注释）。
      - name: Build renderer bundle
        run: npm run build:renderer

      - name: Build theme bundle (writes into dist-renderer/lib, must run after build:renderer)
        run: npm run build:theme

      - name: Pack shared renderer seed box
        run: node scripts/pack-renderer-box.mjs

      - name: Upload renderer box
        uses: actions/upload-artifact@v4
        with:
          name: renderer-box
          retention-days: 3
          path: dist-renderer-artifact/renderer-*.tar.gz
          if-no-files-found: error

  build:
    needs: renderer-box
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dmg
            arch: arm64
          # Run the x64 launch gate natively. macos-latest is an arm64 image;
          # macos-15-intel remains the supported GitHub-hosted Intel label.
          - os: macos-15-intel
            target: dmg
            arch: x64
          - os: windows-latest
            target: nsis
            arch: x64
          - os: ubuntu-latest
            target: AppImage
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Early releases do not retain a long-lived signing secret. Generate a
      # job-local identity so the packaged shell and its seed still share a
      # verifiable integrity boundary. The private key dies with the runner;
      # automatic cross-release hot-update trains therefore remain disabled.
      - name: Prepare ephemeral artifact signing identity
        shell: bash
        run: |
          node scripts/artifact-keygen.mjs \
            --out "$RUNNER_TEMP/hana-release-sign-key.pem" \
            --key-id "release-${{ matrix.target }}-${{ matrix.arch }}" \
            > "$RUNNER_TEMP/hana-release-key.json"
          node -e \
            'const fs = require("fs"); const entry = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.writeFileSync(process.argv[2], JSON.stringify([entry]));' \
            "$RUNNER_TEMP/hana-release-key.json" \
            "$RUNNER_TEMP/hana-release-keyset.json"
          echo "HANA_SIGN_KEY=$RUNNER_TEMP/hana-release-sign-key.pem" >> "$GITHUB_ENV"
          echo "HANA_SIGN_KEYSET=$RUNNER_TEMP/hana-release-keyset.json" >> "$GITHUB_ENV"

      # Windows: 下载官方 MinGit（git + sh-compatible shell + coreutils，非交互运行时），打包进安装包
      - name: Download MinGit
        if: runner.os == 'Windows'
        run: node scripts/download-mingit.js

      # 实测 git 全流程（init/commit/clone）+ sh + coreutils 可运行；runtime 残缺时 fail fast，不出残缺包
      - name: Smoke-test MinGit
        if: runner.os == 'Windows'
        run: node scripts/smoke-mingit.mjs vendor/mingit

      - name: Build client bundles (main + preload + renderer)
        run: npm run build:client

      # 下载 renderer-box job 单点构建好的共享归档，让四个平台复用同一份字节
      # （而不是各自现场打包出内容相同但 tar mtime 不同、sha256 不同的四份）。
      - name: Download shared renderer box
        uses: actions/download-artifact@v4
        with:
          name: renderer-box
          path: prebuilt-renderer

      # 把共享归档的绝对路径通过 HANA_PREBUILT_RENDERER_BOX 环境变量透传给
      # scripts/build-server.mjs 末尾调用的 packDualKindSeed（该函数默认从
      # process.env 读取这个变量，见 scripts/build-server-artifact.mjs）。
      # 这个变量之后由 Node（fs 原生 API）读取，不是再喂给另一个 bash 命令，
      # 所以必须写成 Windows 原生路径（D:\... / D:/...），而不是 git-bash 的
      # /d/... 风格路径——Node 在原生 Windows 上不认识 /d/... 这种挂载点写法。
      # `pwd` 在 Git Bash 里默认返回 /d/... 风格；`pwd -W` 是 MSYS coreutils
      # 提供的扩展，专门用来打印 Windows 原生等价路径，这里按 RUNNER_OS 分支。
      - name: Point seed packer at the shared renderer box
        shell: bash
        run: |
          BOX=$(ls prebuilt-renderer/renderer-*.tar.gz | head -1)
          if [ -z "$BOX" ]; then
            echo "::error::shared renderer box missing from the renderer-box job's upload"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            BOX_DIR=$(pwd -W)
          else
            BOX_DIR=$(pwd)
          fi
          echo "HANA_PREBUILT_RENDERER_BOX=$BOX_DIR/$BOX" >> "$GITHUB_ENV"
          echo "Using shared renderer box: $BOX_DIR/$BOX"

      - name: Build secure filesystem helper
        shell: bash
        run: node scripts/build-secure-fs-helper.mjs ${{ matrix.arch }}

      - name: Build server bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            node scripts/build-server.mjs darwin ${{ matrix.arch }}
          elif [ "$RUNNER_OS" = "Linux" ]; then
            node scripts/build-server.mjs linux ${{ matrix.arch }}
          else
            node scripts/build-server.mjs win32 ${{ matrix.arch }}
          fi

      - name: Build Computer Use helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          HANA_COMPUTER_USE_HELPER_ARCH=${{ matrix.arch }} node scripts/build-computer-use-helper.mjs ${{ matrix.arch }}

      - name: Build Windows sandbox helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/build-windows-sandbox-helper.mjs ${{ matrix.arch }}

      # 独立 Server 下载包与桌面 seed/OTA 是两个发布边界。直接使用本次
      # build-windows-sandbox-helper 的输出，不依赖 electron-builder、
      # win-unpacked 或 Windows 代码签名。验证步骤从解包结果实际运行
      # MinGit、根 hana-server.cmd 和 restricted-token sandbox 链。
      - name: Build Windows standalone server archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/build-standalone-server-artifact.mjs ${{ matrix.arch }}

      - name: Verify Windows standalone server archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/verify-standalone-server-artifact.mjs ${{ matrix.arch }} --smoke

      # 装箱前 fail-closed 复核：electron-builder 是直调（不经过 package.json
      # 的 pack/dist/dist:win/dist:linux 脚本链），scripts/verify-seed-kit.mjs
      # 挂在那条脚本链里、这里不会自动生效，必须单独接线，否则一份陈旧/串
      # 平台的 seed 四件套能被原样装进安装包（见脚本文件头列举的三类事故）。
      # platform/arch 显式传参，不用脚本默认的 process.platform/process.arch，
      # 确保门禁始终校验矩阵声明的 dist-server-artifact/{os}-{arch}/ 目录。
      - name: Verify seed kit (macOS)
        if: runner.os == 'macOS'
        run: node scripts/verify-seed-kit.mjs darwin ${{ matrix.arch }}

      # Early macOS package: no Developer ID certificate and no notarization.
      # Seed Mach-O files retain local ad-hoc signatures so macOS can load them;
      # users may need to approve the app explicitly in System Settings.
      # --publish never：所有 publish 由 release job 单点控制，避免多 job 并发上传造成
      # latest-mac.yml 互相覆盖的时间窗口（那是 v0.98.4 "检查更新失败" 的根因之一）。
      - name: Build macOS (DMG + ZIP)
        if: runner.os == 'macOS'
        run: |
          ulimit -n 65536
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Gate untouched macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG=$(find dist -maxdepth 1 -name '*-macOS-${{ matrix.arch }}.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "::error::macOS DMG for ${{ matrix.arch }} is missing"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          node scripts/platform/macos/run-gate.mjs \
            --direct-flow \
            --packaged-only \
            --launch-smoke \
            --dmg "$DMG" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION"

      # 同上：Windows job 直调 electron-builder，seed kit 校验必须单独接线。
      - name: Verify seed kit (Windows)
        if: runner.os == 'Windows'
        run: node scripts/verify-seed-kit.mjs win32 ${{ matrix.arch }}

      # Early Windows package: no Authenticode certificate. SmartScreen may
      # warn users, who can choose whether to continue the installation.
      # --publish never：和 mac 同理，由 release job 单点上传。
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Gate unsigned Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Windows installer is missing' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'HanaKDE-gate-install'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          $version = node -p "require('./package.json').version"
          node scripts/platform/windows/run-gate.mjs `
            --package $installRoot `
            --installer $installer `
            --arch ${{ matrix.arch }} `
            --direct-flow `
            --install $installRoot `
            --version $version

      # 同上：Linux job 直调 electron-builder，seed kit 校验必须单独接线。
      - name: Verify seed kit (Linux)
        if: runner.os == 'Linux'
        run: node scripts/verify-seed-kit.mjs linux ${{ matrix.arch }}

      # Linux Preview 打包
      # AppImage 给下载即用体验，deb 给 Ubuntu/Debian 系安装。
      - name: Build Linux preview packages
        if: runner.os == 'Linux'
        run: |
          npx electron-builder --linux AppImage deb --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only end-user packages and the standalone Windows server leave the
      # build job. Per-job seed archives use ephemeral identities and stay
      # inside the installer; they are intentionally not published for OTA.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 3
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist-standalone/HanaKDE-Core-*-Windows-x64.tar.gz
            dist-standalone/HanaKDE-Core-*-Windows-x64.manifest.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      # 所有 Release 默认 pre-release，手动在 GitHub 上将稳定版本标记为 latest

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # build job 改为 --publish never 后，draft release 不再由 electron-builder 自动创建，
      # 由 release job 显式创建，并通过 --generate-notes 从上一个 tag 的 commit 自动生成 changelog。
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping create"
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --prerelease \
              --title "${{ github.ref_name }}" \
              --notes "Early development release. macOS and Windows packages are not code-signed or notarized, so operating-system security prompts are expected. Review the source and proceed only if you trust this build. Automatic hot-update trains are disabled; install later versions manually." \
              --generate-notes
          fi

      # 合并双架构的 latest-mac.yml（本地生成，不上传；上传由下一步统一处理）
      - name: Generate merged latest-mac.yml
        run: |
          node scripts/merge-latest-mac-yml.cjs artifacts latest-mac.yml

      # 更新摘要必须在本地 tag 前生成并提交。CI 只校验，不调用 LLM。
      - name: Validate committed release digest
        run: |
          node scripts/validate-release-digest.mjs \
            --tag "${{ github.ref_name }}" \
            --file release-digest.v1.json

      # 单点上传所有 release assets（dmg/zip/exe/AppImage/deb/yml），blockmap 不上传
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=== Uploading installers ==="
          find artifacts \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "  $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done

          echo "=== Uploading self-contained Windows standalone server assets ==="
          find artifacts -type f \( \
              -path '*/dist-standalone/HanaKDE-Core-*-Windows-x64.tar.gz' -o \
              -path '*/dist-standalone/HanaKDE-Core-*-Windows-x64.manifest.json' \
            \) -print0 |
            while IFS= read -r -d '' f; do
              echo "  $f"
              gh release upload "${{ github.ref_name }}" "$f" --clobber
            done

          echo "=== Uploading latest.yml (Windows) ==="
          WIN_YML=$(find artifacts -name 'latest.yml' | head -1)
          if [ -n "$WIN_YML" ]; then
            echo "  $WIN_YML"
            gh release upload "${{ github.ref_name }}" "$WIN_YML" --clobber
          else
            echo "::warning::latest.yml not found (Windows build may have failed)"
          fi

          echo "=== Uploading latest-mac.yml (merged) ==="
          gh release upload "${{ github.ref_name }}" latest-mac.yml --clobber

          echo "=== Uploading release digest ==="
          gh release upload "${{ github.ref_name }}" release-digest.v1.json --clobber

          echo "=== Uploading latest-linux.yml ==="
          LINUX_YML=$(find artifacts -name 'latest-linux.yml' | head -1)
          if [ -n "$LINUX_YML" ]; then
            echo "  $LINUX_YML"
            gh release upload "${{ github.ref_name }}" "$LINUX_YML" --clobber
          else
            echo "::warning::latest-linux.yml not found (Linux build may have failed)"
          fi

      # 硬约束：release 必须包含所有必需产物，缺一个 CI 就 fail，draft 状态留给人手动检查。
      # 防止以后再有 shell 写漏 / electron-builder 配置改坏 / 单架构构建挂掉 造成的 yml 缺失。
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ASSETS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          echo "=== Release assets ==="
          echo "$ASSETS"
          echo ""

          MISSING=()
          echo "$ASSETS" | grep -qx 'latest-mac.yml' || MISSING+=("latest-mac.yml")
          echo "$ASSETS" | grep -qx 'latest.yml' || MISSING+=("latest.yml")
          echo "$ASSETS" | grep -qx 'latest-linux.yml' || MISSING+=("latest-linux.yml")
          echo "$ASSETS" | grep -qx 'release-digest.v1.json' || MISSING+=("release-digest.v1.json")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-macOS-arm64\.dmg$' || MISSING+=("macOS-arm64.dmg")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-macOS-arm64\.zip$' || MISSING+=("macOS-arm64.zip")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-macOS-x64\.dmg$' || MISSING+=("macOS-x64.dmg")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-macOS-x64\.zip$' || MISSING+=("macOS-x64.zip")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-Windows-x64\.exe$' || MISSING+=("Windows-x64.exe")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-Linux-(x64|x86_64)\.AppImage$' || MISSING+=("Linux AppImage")
          echo "$ASSETS" | grep -qE '^HanaKDE-.*-Linux-(x64|amd64)\.deb$' || MISSING+=("Linux deb")
          echo "$ASSETS" | grep -qE '^HanaKDE-Core-.*-Windows-x64\.tar\.gz$' || MISSING+=("Windows x64 standalone server archive")
          echo "$ASSETS" | grep -qE '^HanaKDE-Core-.*-Windows-x64\.manifest\.json$' || MISSING+=("Windows x64 standalone server manifest")

          if echo "$ASSETS" | grep -qE '^HanaKDE-Core-.*-Windows-x64\.manifest\.json\.sig$'; then
            echo "::error::Obsolete standalone manifest signature leaked into the release"
            exit 1
          fi

          # 清洁性检查：不应该有 blockmap 漏进来
          if echo "$ASSETS" | grep -qE '\.blockmap$'; then
            echo "::warning::blockmap files leaked into release (should be excluded by design):"
            echo "$ASSETS" | grep -E '\.blockmap$'
          fi

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::Missing required assets: ${MISSING[*]}"
            echo "Release will remain as draft for manual inspection."
            exit 1
          fi
          echo ""
          echo "✓ All required assets present"

      - name: Publish release (un-draft, pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --prerelease --draft=false
