name: CI

on:
  push:
    branches: [hanakde]
  pull_request:
    branches: [hanakde]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Each operating system is release evidence. Do not cancel Windows or
      # Linux merely because another platform fails first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.15.0"]

    steps:
      - uses: actions/checkout@v4
        with:
          # KW-RULE-PREFLIGHT verifies that the audited baseline remains an
          # ancestor. A depth-one PR checkout cannot prove that invariant.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build secure filesystem helper
        if: runner.os != 'Linux'
        run: node scripts/build-secure-fs-helper.mjs

      - name: Configure Linux secure filesystem test fixture
        if: runner.os == 'Linux'
        shell: bash
        run: echo "HANA_SECURE_FS_HELPER_PATH=$GITHUB_WORKSPACE/tests/fixtures/secure-fs-helper/written.cjs" >> "$GITHUB_ENV"

      - name: Build Windows sandbox helper
        if: runner.os == 'Windows'
        run: node scripts/build-windows-sandbox-helper.mjs x64

      - name: Smoke-test Windows restricted-token helper
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-sandbox-helper.mjs x64

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build packages
        run: npm run build:packages

      - name: Build renderer
        run: npm run build:renderer

      # The tag-only Build workflow verifies the extracted Windows standalone
      # package by launching its real hana-server.cmd and exercising exec_command.
      # Preserve that main-branch guard with a throwaway keyset, but keep PR's
      # ten-minute regular-test matrix focused on its three real test runs.
      # Otherwise Windows spends the whole matrix budget packaging before
      # `npm test` can establish its own platform result.
      - name: Prepare ephemeral signing key for Windows standalone smoke
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          node scripts/artifact-keygen.mjs \
            --out "$RUNNER_TEMP/hana-ci-sign-key.pem" \
            --key-id ci-ephemeral \
            > "$RUNNER_TEMP/hana-ci-key.json"
          node -e \
            'const fs = require("fs"); const entry = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.writeFileSync(process.argv[2], JSON.stringify([entry]));' \
            "$RUNNER_TEMP/hana-ci-key.json" \
            "$RUNNER_TEMP/hana-ci-keyset.json"
          echo "HANA_SIGN_KEY=$RUNNER_TEMP/hana-ci-sign-key.pem" >> "$GITHUB_ENV"
          echo "HANA_SIGN_KEYSET=$RUNNER_TEMP/hana-ci-keyset.json" >> "$GITHUB_ENV"

      - name: Download MinGit for Windows standalone smoke
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: node scripts/download-mingit.js

      - name: Build Windows server bundle for standalone smoke
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: node scripts/build-server.mjs win32 x64

      - name: Build Windows standalone server archive in CI
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: node scripts/build-standalone-server-artifact.mjs x64

      - name: Smoke-test packaged Windows standalone server
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        run: node scripts/verify-standalone-server-artifact.mjs x64 --smoke

      - name: Run general tests
        # The fixed four Vitest workers share libuv's default four I/O threads.
        # Give the real cross-platform filesystem suite sufficient independent
        # I/O capacity without changing its worker count or any test timeout.
        # The 10,000-entry fixture has its own deterministic, single-worker
        # filesystem gate below. The closure census also has its own real,
        # single-worker gate: each assertion performs multiple esbuild + nft
        # scans of the repository. DeskSection and the real 1.6 MiB external
        # upload stream and File History modal are likewise independent
        # regressions with deterministic single-worker gates below. Keeping these
        # CPU/metadata-heavy suites out of this four-worker step prevents
        # Windows I/O contention; no suite is skipped.
        env:
          UV_THREADPOOL_SIZE: 16
        run: npm test -- --maxWorkers=4 --exclude tests/knowledge-performance-fixtures.test.ts --exclude tests/cli-closure-census.test.ts --exclude tests/knowledge-copy-service.test.ts --exclude desktop/src/react/__tests__/components/DeskSection.test.tsx --exclude desktop/src/react/__tests__/components/FileHistoryModal.test.tsx

      - name: Run isolated workspace panel regression
        env:
          UV_THREADPOOL_SIZE: 16
        run: npx vitest run desktop/src/react/__tests__/components/DeskSection.test.tsx --maxWorkers=1

      - name: Run isolated File History modal regression
        env:
          UV_THREADPOOL_SIZE: 16
        run: npx vitest run desktop/src/react/__tests__/components/FileHistoryModal.test.tsx --maxWorkers=1

      - name: Run built-in Todo unit and contract tests
        run: npm test --prefix plugins/todolist

      - name: Run isolated Knowledge fixture filesystem gate
        env:
          UV_THREADPOOL_SIZE: 16
        run: npx vitest run tests/knowledge-performance-fixtures.test.ts --maxWorkers=1

      - name: Run isolated Knowledge copy stream gate
        env:
          UV_THREADPOOL_SIZE: 16
        run: npx vitest run tests/knowledge-copy-service.test.ts --maxWorkers=1

      - name: Run isolated CLI runtime-closure audit
        env:
          UV_THREADPOOL_SIZE: 16
        run: npx vitest run tests/cli-closure-census.test.ts --maxWorkers=1

  knowledge-workspace-e2e:
    name: knowledge-workspace-e2e (${{ matrix.os }}, ${{ matrix.project }}, ${{ matrix.shard_name || 'full' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: [desktop-full, web-open, web-full]
        exclude:
          - os: windows-latest
            project: desktop-full
        include:
          - os: windows-latest
            project: desktop-full
            shard: "1/3"
            shard_name: shard-1-of-3
          - os: windows-latest
            project: desktop-full
            shard: "2/3"
            shard_name: shard-2-of-3
          - os: windows-latest
            project: desktop-full
            shard: "3/3"
            shard_name: shard-3-of-3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.15.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build secure filesystem helper
        if: runner.os != 'Linux'
        run: node scripts/build-secure-fs-helper.mjs

      - name: Build Windows sandbox helper for desktop E2E
        if: runner.os == 'Windows' && matrix.project == 'desktop-full'
        run: node scripts/build-windows-sandbox-helper.mjs x64

      - name: Configure Linux secure filesystem test fixture
        if: runner.os == 'Linux'
        shell: bash
        run: echo "HANA_SECURE_FS_HELPER_PATH=$GITHUB_WORKSPACE/tests/fixtures/secure-fs-helper/written.cjs" >> "$GITHUB_ENV"

      - name: Install Chromium and Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Build desktop test artifacts
        run: npm run build:preload && npm run build:renderer

      - name: Run Knowledge Workspace project/platform gate
        shell: bash
        env:
          NODE_ENV: test
          PLAYWRIGHT_SHARD: ${{ matrix.shard || '' }}
          DEBUG: ${{ runner.os == 'Windows' && matrix.project == 'desktop-full' && 'pw:browser' || '' }}
        run: |
          run_project() {
            shard_args=()
            if [ -n "$PLAYWRIGHT_SHARD" ]; then
              shard_args+=("--shard=$PLAYWRIGHT_SHARD")
            fi
            if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.project }}" = "desktop-full" ]; then
              xvfb-run --auto-servernum npx playwright test \
                -c tests/knowledge-workspace-e2e/playwright.config.ts \
                --project=${{ matrix.project }} "${shard_args[@]}" "$@"
            else
              npx playwright test \
                -c tests/knowledge-workspace-e2e/playwright.config.ts \
                --project=${{ matrix.project }} "${shard_args[@]}" "$@"
            fi
          }

          # E2E-KW-006 exercises native PDF/media preview processes, while
          # E2E-KW-022 continuously replaces a parent directory with a Windows
          # junction. Give both native-process boundaries a fresh one-shot
          # Playwright worker. Split the remaining tests at test granularity so
          # no Windows Chromium worker owns more than six browser contexts.
          # This is process isolation, not a retry: every shard is mandatory and
          # retries stay disabled in the config.
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.project }}" = "web-open" ]; then
            run_project --grep 'E2E-KW-006'
            run_project --grep 'E2E-KW-022'
            for shard in 1/5 2/5 3/5 4/5 5/5; do
              run_project --fully-parallel --shard="$shard" --grep-invert 'E2E-KW-006|E2E-KW-022'
            done
          else
            run_project
          fi

      - name: Upload Knowledge Workspace E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-e2e-${{ matrix.os }}-${{ matrix.project }}-${{ matrix.shard_name || 'full' }}
          path: tests/knowledge-workspace-e2e/artifacts
          if-no-files-found: ignore

  # 独立于上面 test 矩阵：只跑边界 lint 脚本本身，给"开/闭边界回归"一个比
  # 全量矩阵（typecheck/lint/build/test 跑完才轮到 npm test 里的边界用例）
  # 更快的失败信号。npm test 仍会通过 tests/open-boundary-lint.test.ts 的
  # 冒烟用例 spawn 同一个脚本验证退出码/输出，这里不是重复覆盖，是提前示警。
  lint-open-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint open/closed import boundary
        run: node scripts/lint-open-boundary.mjs

  # 证明"开源 composition 构建"这条独立产物链没有烧掉：构建 + spawn 冒烟。
  # 与 build.yml 的安装包矩阵无关——那条链打的是闭集产品安装包，从不触碰
  # server/main-open.ts 这个开源薄入口。npm ci 走网络下载依赖，网络抖动允许
  # 重试一次（不改脚本本身，只在 workflow 步骤层面兜底）。
  open-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies (with one retry on network failure)
        run: npm ci || (echo "npm ci failed, retrying once..." && npm ci)

      - name: Build open composition server
        run: npm run build:server:open

      - name: Smoke-test open composition server
        run: npm run smoke:server:open
